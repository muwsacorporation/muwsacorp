<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuwsaCorp</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8ff;
      color: #102344;
    }

    header {
      padding: 24px 8%;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5edfa;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #1769ff;
    }

    .hero {
      min-height: 75vh;
      padding: 90px 8%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      background: linear-gradient(135deg, #ffffff, #e4efff);
    }

    .tag {
      color: #1769ff;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(42px, 7vw, 76px);
      margin: 18px 0;
      max-width: 750px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      max-width: 620px;
      color: #52627b;
    }

    .button {
      display: inline-block;
      margin-top: 22px;
      padding: 15px 25px;
      background: #1769ff;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    footer {
      padding: 25px 8%;
      background: white;
      color: #52627b;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">MuwsaCorp 🚀</div>
    <div>Our future starts here.</div>
  </header>

  <main class="hero">
    <div class="tag">INNOVATION • TECHNOLOGY • FUTURE</div>
    <h1>We build ideas for tomorrow.</h1>
    <p>O‘zing bilan ishla, natijasi 10 yildan keyin chiqadi.</p>
    <a class="button" href="https://t.me/muwsacorp">Explore MuwsaCorp ↗</a>
  </main>

  <footer>© 2026 MuwsaCorp. Built step by step.</footer>
</body>
</html>
